
name: Build Afterflow Random Ticks

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply random tick patch
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'afterflow_random_tick_source_patch.zip' -DestinationPath '.' -Force
          python 'afterflow_random_patch/apply_random_stage.py' '.'

      - name: Compile Windows mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: given
          target: Win64

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: afterflow-random-ticks-win64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
   
